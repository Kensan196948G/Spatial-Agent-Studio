<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="本社・支店内現場管理者">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#38e1ff"/></linearGradient>
    <style><![CDATA[
      .ring{transform-origin:48px 48px;animation:pulse 3.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.3;transform:scale(.92)}50%{opacity:.85;transform:scale(1.04)}}
      .w1{animation:win 3s steps(1) infinite}
      .w2{animation:win 3s steps(1) infinite .6s}
      .w3{animation:win 4s steps(1) infinite 1.2s}
      @keyframes win{0%,70%{opacity:1}71%,100%{opacity:.25}}
    ]]></style>
  </defs>
  <rect width="96" height="96" rx="22" fill="#0b1430" stroke="#1f2b52"/>
  <circle class="ring" cx="48" cy="48" r="34" fill="none" stroke="#8b7bff" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 6"/>
  <g fill="none" stroke="url(#g2)" stroke-width="2.6" stroke-linejoin="round">
    <rect x="30" y="26" width="26" height="46" rx="2"/>
    <rect x="58" y="40" width="18" height="32" rx="2"/>
    <path d="M24 72h60"/>
  </g>
  <g fill="#8b7bff">
    <rect class="w1" x="35" y="33" width="6" height="5" rx="1"/>
    <rect class="w2" x="45" y="33" width="6" height="5" rx="1"/>
    <rect class="w3" x="35" y="44" width="6" height="5" rx="1"/>
    <rect class="w1" x="45" y="44" width="6" height="5" rx="1"/>
    <rect class="w2" x="63" y="47" width="8" height="4" rx="1"/>
    <rect class="w3" x="63" y="56" width="8" height="4" rx="1"/>
    <rect class="w1" x="63" y="65" width="8" height="4" rx="1"/>
  </g>
</svg>
