<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="現場代理人・管理者">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#3ee07f"/></linearGradient>
    <style><![CDATA[
      .ring{transform-origin:48px 48px;animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.9;transform:scale(1.04)}}
      .helmet{animation:bob 4s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      .badge{animation:blink 2.6s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
    ]]></style>
  </defs>
  <rect width="96" height="96" rx="22" fill="#0b1430" stroke="#1f2b52"/>
  <circle class="ring" cx="48" cy="48" r="34" fill="none" stroke="#3ee07f" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 6"/>
  <g class="helmet" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 56c0-13 9.8-24 22-24s22 11 22 24"/>
    <path d="M22 56h52"/>
    <path d="M24 62h48"/>
    <path d="M42 34h12"/>
  </g>
  <g class="badge">
    <circle cx="66" cy="30" r="9" fill="#0b1430" stroke="#3ee07f" stroke-width="2"/>
    <path d="M61.8 30.2l3 3 5.2-6" fill="none" stroke="#3ee07f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
